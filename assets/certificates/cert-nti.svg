<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ntiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b11"/>
      <stop offset="100%" stop-color="#2d121c"/>
    </linearGradient>
    <linearGradient id="ntiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ntiBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#ntiGrad)" stroke="#9f1239" stroke-width="2"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="url(#ntiAccent)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <g transform="translate(50, 50)">
    <!-- Organization Badge -->
    <rect width="80" height="44" rx="10" fill="url(#ntiBadge)"/>
    <text x="40" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1.5">NTI</text>
    
    <!-- Title & Subtitle -->
    <text x="98" y="24" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">National Telecommunication Institute</text>
    <text x="98" y="44" fill="#fda4af" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Full-Stack Web Development in PHP &amp; Laravel</text>
    
    <!-- Divider -->
    <path d="M 0 85 L 500 85" stroke="#881337" stroke-width="1"/>
    
    <!-- Body Content -->
    <text x="250" y="130" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Ministry of Communications and Information Technology (MCIT)</text>
    <text x="250" y="170" fill="#fb7185" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Philopateer Waheed</text>
    <text x="250" y="202" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">PHP • Laravel • MySQL Data Schemas • Secure Authentication</text>
    <text x="250" y="224" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">MVC Architecture • Database Migrations • Dynamic Admin Dashboards</text>

    <!-- Verified Badge Footer -->
    <rect x="180" y="250" width="140" height="28" rx="14" fill="#4c0519" stroke="#f43f5e"/>
    <text x="250" y="268" fill="#fecdd3" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Verified NTI Diploma</text>
  </g>
</svg>
