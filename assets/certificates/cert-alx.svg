<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="alxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="alxAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#alxGrad)" stroke="#312e81" stroke-width="2"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="url(#alxAccent)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  
  <g transform="translate(60, 60)">
    <!-- Organization Logo Placeholder -->
    <rect width="70" height="70" rx="14" fill="url(#alxAccent)"/>
    <text x="35" y="44" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">ALX</text>
    
    <!-- Title -->
    <text x="95" y="32" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">ALX Training Certification</text>
    <text x="95" y="55" fill="#94a3b8" font-family="sans-serif" font-size="13">Professional Foundations &amp; Back-End Web Development</text>
    
    <!-- Ribbon -->
    <path d="M 0 110 L 480 110" stroke="#334155" stroke-width="1"/>
    
    <!-- Recipient -->
    <text x="240" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">This certifies that</text>
    <text x="240" y="190" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Philopateer Waheed</text>
    <text x="240" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">has successfully completed Back-End Web Development &amp; Professional Foundations</text>

    <!-- Badge Footer -->
    <rect x="180" y="245" width="120" height="28" rx="14" fill="#1e1b4b" stroke="#06b6d4"/>
    <text x="240" y="263" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Verified Credential</text>
  </g>
</svg>
