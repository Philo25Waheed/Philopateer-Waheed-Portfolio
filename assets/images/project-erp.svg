<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="erpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#erpGrad)"/>
  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="12" fill="#111827" stroke="#1e293b" stroke-width="2"/>
    <rect width="720" height="44" rx="12" fill="#1f2937"/>
    <rect y="32" width="720" height="12" fill="#1f2937"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="22" r="5" fill="#10b981"/>
    <text x="360" y="27" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Enterprise Resource Planning System — Management Operations</text>
    
    <!-- Sidebar -->
    <rect y="44" width="150" height="346" fill="#0b0f19" stroke="#1e293b"/>
    <rect x="15" y="70" width="120" height="30" rx="6" fill="#2563eb" opacity="0.8"/>
    <text x="45" y="90" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Overview</text>
    <rect x="15" y="110" width="120" height="25" rx="6" fill="#1f2937"/>
    <text x="45" y="127" fill="#94a3b8" font-family="sans-serif" font-size="11">Inventory</text>
    <rect x="15" y="145" width="120" height="25" rx="6" fill="#1f2937"/>
    <text x="45" y="162" fill="#94a3b8" font-family="sans-serif" font-size="11">Sales Log</text>
    <rect x="15" y="180" width="120" height="25" rx="6" fill="#1f2937"/>
    <text x="45" y="197" fill="#94a3b8" font-family="sans-serif" font-size="11">HR / Staff</text>
    <rect x="15" y="215" width="120" height="25" rx="6" fill="#1f2937"/>
    <text x="45" y="232" fill="#94a3b8" font-family="sans-serif" font-size="11">Finance</text>

    <!-- Main Analytics area -->
    <g transform="translate(170, 60)">
      <!-- Line Chart Preview -->
      <rect width="340" height="180" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="15" y="25" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="bold">Operations Analytics</text>
      <path d="M 20 140 Q 80 110, 140 120 T 260 70 T 320 50" fill="none" stroke="url(#blueGlow)" stroke-width="3"/>
      <path d="M 20 140 Q 80 110, 140 120 T 260 70 T 320 50 L 320 160 L 20 160 Z" fill="url(#blueGlow)" opacity="0.15"/>

      <!-- Stat Widget Right -->
      <rect x="355" width="175" height="85" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="370" y="25" fill="#9ca3af" font-family="sans-serif" font-size="10">Active Modules</text>
      <text x="370" y="55" fill="#60a5fa" font-family="sans-serif" font-size="22" font-weight="bold">8 Operational</text>

      <rect x="355" y="95" width="175" height="85" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="370" y="120" fill="#9ca3af" font-family="sans-serif" font-size="10">Database Status</text>
      <text x="370" y="150" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold">MySQL Sync OK</text>

      <!-- Bottom Table preview -->
      <rect y="195" width="530" height="120" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="15" y="218" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="bold">Recent Business Transactions</text>
      <rect x="15" y="230" width="500" height="2" fill="#374151"/>
      <rect x="15" y="245" width="200" height="12" rx="3" fill="#374151"/>
      <rect x="380" y="245" width="135" height="12" rx="3" fill="#059669"/>
      <rect x="15" y="270" width="180" height="12" rx="3" fill="#374151"/>
      <rect x="380" y="270" width="135" height="12" rx="3" fill="#059669"/>
    </g>
  </g>
</svg>
