<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ecomGrad)"/>
  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Header -->
    <rect width="720" height="44" rx="12" fill="#0f172a"/>
    <text x="30" y="27" fill="#ef4444" font-family="sans-serif" font-size="15" font-weight="bold">Laravel Storefront</text>
    <rect x="220" y="10" width="280" height="24" rx="12" fill="#1e293b"/>
    <text x="240" y="26" fill="#64748b" font-family="sans-serif" font-size="10">Search products, categories...</text>
    <rect x="620" y="10" width="70" height="24" rx="12" fill="url(#redGrad)"/>
    <text x="655" y="26" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cart (3)</text>

    <!-- Product Grid Preview -->
    <g transform="translate(30, 65)">
      <!-- Item 1 -->
      <rect width="200" height="300" rx="8" fill="#0f172a" stroke="#334155"/>
      <rect x="15" y="15" width="170" height="130" rx="6" fill="#1e293b"/>
      <text x="100" y="85" fill="#ef4444" font-family="sans-serif" font-size="12" text-anchor="middle">Laravel Product</text>
      <text x="15" y="170" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Developer Tech Hoodie</text>
      <text x="15" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Category: Apparel</text>
      <text x="15" y="220" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">$49.99</text>
      <rect x="15" y="245" width="170" height="32" rx="6" fill="url(#redGrad)"/>
      <text x="100" y="265" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add to Cart</text>

      <!-- Item 2 -->
      <rect x="230" width="200" height="300" rx="8" fill="#0f172a" stroke="#334155"/>
      <rect x="245" y="15" width="170" height="130" rx="6" fill="#1e293b"/>
      <text x="330" y="85" fill="#3b82f6" font-family="sans-serif" font-size="12" text-anchor="middle">Hardware</text>
      <text x="245" y="170" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Mechanical Keyboard</text>
      <text x="245" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Category: Peripherals</text>
      <text x="245" y="220" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">$129.00</text>
      <rect x="245" y="245" width="170" height="32" rx="6" fill="url(#redGrad)"/>
      <text x="330" y="265" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add to Cart</text>

      <!-- Item 3 -->
      <rect x="460" width="200" height="300" rx="8" fill="#0f172a" stroke="#334155"/>
      <rect x="475" y="15" width="170" height="130" rx="6" fill="#1e293b"/>
      <text x="560" y="85" fill="#10b981" font-family="sans-serif" font-size="12" text-anchor="middle">Accessories</text>
      <text x="475" y="170" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Ergonomic Mouse</text>
      <text x="475" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Category: Gadgets</text>
      <text x="475" y="220" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">$79.50</text>
      <rect x="475" y="245" width="170" height="32" rx="6" fill="url(#redGrad)"/>
      <text x="560" y="265" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add to Cart</text>
    </g>
  </g>
</svg>
