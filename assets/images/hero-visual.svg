<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <rect width="800" height="600" fill="transparent"/>
  <circle cx="400" cy="300" r="280" fill="url(#bgGlow)"/>

  <!-- Floating Tech Badge 1: Laravel -->
  <g transform="translate(60, 80)" filter="url(#softShadow)">
    <rect width="130" height="48" rx="24" fill="#1f2937" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="65" y="29" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Laravel</text>
  </g>

  <!-- Floating Tech Badge 2: MySQL -->
  <g transform="translate(620, 110)" filter="url(#softShadow)">
    <rect width="120" height="48" rx="24" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="60" y="29" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MySQL</text>
  </g>

  <!-- Floating Tech Badge 3: C++ / C# -->
  <g transform="translate(40, 470)" filter="url(#softShadow)">
    <rect width="110" height="48" rx="24" fill="#1f2937" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="55" y="29" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">C++ / C#</text>
  </g>

  <!-- Floating Tech Badge 4: Python -->
  <g transform="translate(640, 450)" filter="url(#softShadow)">
    <rect width="120" height="48" rx="24" fill="#1f2937" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="60" y="29" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python</text>
  </g>

  <!-- Main Code Editor Card -->
  <g transform="translate(120, 100)" filter="url(#softShadow)">
    <!-- Main Window Outer Frame -->
    <rect width="560" height="380" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Window Header Controls -->
    <rect width="560" height="44" rx="16" fill="#111827"/>
    <rect x="0" y="28" width="560" height="16" fill="#111827"/>
    <line x1="0" y1="44" x2="560" y2="44" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window Traffic Lights -->
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#eab308"/>
    <circle cx="64" cy="22" r="6" fill="#22c55e"/>

    <!-- Window Title -->
    <text x="280" y="27" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">PhilopateerWaheed.config.js</text>

    <!-- Code Content -->
    <g transform="translate(28, 70)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14">
      <text x="0" y="0" fill="#64748b">1</text>
      <text x="30" y="0" fill="#f472b6">const</text>
      <text x="80" y="0" fill="#38bdf8">engineer</text>
      <text x="160" y="0" fill="#94a3b8">=</text>
      <text x="180" y="0" fill="#f472b6">{</text>

      <text x="0" y="28" fill="#64748b">2</text>
      <text x="50" y="28" fill="#a7f3d0">name:</text>
      <text x="110" y="28" fill="#fde047">'Philopateer Waheed'</text>
      <text x="285" y="28" fill="#94a3b8">,</text>

      <text x="0" y="56" fill="#64748b">3</text>
      <text x="50" y="56" fill="#a7f3d0">role:</text>
      <text x="110" y="56" fill="#fde047">'Software Engineer | Web Developer'</text>
      <text x="415" y="56" fill="#94a3b8">,</text>

      <text x="0" y="84" fill="#64748b">4</text>
      <text x="50" y="84" fill="#a7f3d0">university:</text>
      <text x="160" y="84" fill="#fde047">'Ahram Canadian University'</text>
      <text x="390" y="84" fill="#94a3b8">,</text>

      <text x="0" y="112" fill="#64748b">5</text>
      <text x="50" y="112" fill="#a7f3d0">major:</text>
      <text x="120" y="112" fill="#fde047">'Software Engineering'</text>
      <text x="315" y="112" fill="#94a3b8">,</text>

      <text x="0" y="140" fill="#64748b">6</text>
      <text x="50" y="140" fill="#a7f3d0">coreStack:</text>
      <text x="145" y="140" fill="#818cf8">[</text>
      <text x="155" y="140" fill="#fde047">'PHP'</text>
      <text x="200" y="140" fill="#94a3b8">,</text>
      <text x="215" y="140" fill="#fde047">'Laravel'</text>
      <text x="295" y="140" fill="#94a3b8">,</text>
      <text x="310" y="140" fill="#fde047">'MySQL'</text>
      <text x="380" y="140" fill="#818cf8">]</text>
      <text x="390" y="140" fill="#94a3b8">,</text>

      <text x="0" y="168" fill="#64748b">7</text>
      <text x="50" y="168" fill="#a7f3d0">passions:</text>
      <text x="140" y="168" fill="#818cf8">[</text>
      <text x="150" y="168" fill="#fde047">'Scalable Systems'</text>
      <text x="305" y="168" fill="#94a3b8">,</text>
      <text x="320" y="168" fill="#fde047">'Clean Code'</text>
      <text x="430" y="168" fill="#818cf8">]</text>
      <text x="440" y="168" fill="#94a3b8">,</text>

      <text x="0" y="196" fill="#64748b">8</text>
      <text x="50" y="196" fill="#38bdf8">buildSystem</text>
      <text x="155" y="196" fill="#f472b6">() {</text>

      <text x="0" y="224" fill="#64748b">9</text>
      <text x="80" y="224" fill="#f472b6">return</text>
      <text x="140" y="224" fill="#fde047">`High Performance Web App`</text>
      <text x="365" y="224" fill="#94a3b8">;</text>

      <text x="0" y="252" fill="#64748b">10</text>
      <text x="50" y="252" fill="#f472b6">}</text>

      <text x="0" y="280" fill="#64748b">11</text>
      <text x="30" y="280" fill="#f472b6">};</text>
      <rect x="60" y="267" width="10" height="18" fill="#06b6d4" opacity="0.8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
