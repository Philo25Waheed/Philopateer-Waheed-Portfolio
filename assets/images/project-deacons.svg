<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="deaconsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#deaconsGrad)"/>
  
  <!-- Dashboard Wireframe Overlay -->
  <g transform="translate(40, 30)" opacity="0.95">
    <!-- Top Bar -->
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <circle cx="24" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>
    <rect x="90" y="12" width="220" height="16" rx="4" fill="#0f172a"/>
    <text x="100" y="24" fill="#64748b" font-family="sans-serif" font-size="10">Deacons School Management System — Admin Dashboard</text>

    <!-- Sidebar -->
    <rect y="50" width="160" height="340" rx="8" fill="#0f172a" stroke="#334155"/>
    <rect x="15" y="70" width="130" height="12" rx="3" fill="#3b82f6" opacity="0.8"/>
    <rect x="15" y="95" width="110" height="10" rx="3" fill="#334155"/>
    <rect x="15" y="115" width="120" height="10" rx="3" fill="#334155"/>
    <rect x="15" y="135" width="90" height="10" rx="3" fill="#334155"/>
    <rect x="15" y="155" width="115" height="10" rx="3" fill="#334155"/>

    <!-- Main Content Area -->
    <!-- Stat Cards -->
    <g transform="translate(175, 50)">
      <rect width="165" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="15" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Students</text>
      <text x="15" y="52" fill="#06b6d4" font-family="sans-serif" font-size="20" font-weight="bold">342</text>

      <rect x="180" width="165" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="195" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Servants</text>
      <text x="195" y="52" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">28</text>

      <rect x="360" width="175" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="375" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Points / Taio System</text>
      <text x="375" y="52" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">12,450 pts</text>
    </g>

    <!-- Role Badges & Attendance Table Preview -->
    <g transform="translate(175, 135)">
      <rect width="545" height="255" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Role Dashboards & Attendance Tracking</text>

      <!-- Table Header -->
      <rect x="20" y="45" width="505" height="28" rx="4" fill="#0f172a"/>
      <text x="30" y="63" fill="#64748b" font-family="sans-serif" font-size="11">Student Name</text>
      <text x="160" y="63" fill="#64748b" font-family="sans-serif" font-size="11">Class Grade</text>
      <text x="270" y="63" fill="#64748b" font-family="sans-serif" font-size="11">Attendance Status</text>
      <text x="410" y="63" fill="#64748b" font-family="sans-serif" font-size="11">Points</text>

      <!-- Row 1 -->
      <text x="30" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="11">Deacon Michael N.</text>
      <text x="160" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11">Advanced Hymns</text>
      <rect x="270" y="85" width="80" height="18" rx="9" fill="#065f46"/>
      <text x="310" y="97" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Present</text>
      <text x="410" y="98" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">+150 pts</text>

      <!-- Row 2 -->
      <text x="30" y="133" fill="#e2e8f0" font-family="sans-serif" font-size="11">Deacon Anthony K.</text>
      <text x="160" y="133" fill="#94a3b8" font-family="sans-serif" font-size="11">Coptic Language II</text>
      <rect x="270" y="120" width="80" height="18" rx="9" fill="#065f46"/>
      <text x="310" y="132" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Present</text>
      <text x="410" y="133" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">+200 pts</text>

      <!-- Feature Pill Badges -->
      <g transform="translate(20, 185)">
        <rect width="115" height="24" rx="12" fill="#0284c7" opacity="0.3" stroke="#38bdf8"/>
        <text x="57" y="16" fill="#7dd3fc" font-family="sans-serif" font-size="10" text-anchor="middle">Admin Dashboard</text>

        <rect x="125" width="120" height="24" rx="12" fill="#4f46e5" opacity="0.3" stroke="#818cf8"/>
        <text x="185" y="16" fill="#c7d2fe" font-family="sans-serif" font-size="10" text-anchor="middle">Servant Dashboard</text>

        <rect x="255" width="120" height="24" rx="12" fill="#059669" opacity="0.3" stroke="#34d399"/>
        <text x="315" y="16" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">Student Dashboard</text>

        <rect x="385" width="120" height="24" rx="12" fill="#d97706" opacity="0.3" stroke="#fcd34d"/>
        <text x="445" y="16" fill="#fef08a" font-family="sans-serif" font-size="10" text-anchor="middle">Parent Dashboard</text>
      </g>
    </g>
  </g>
</svg>
